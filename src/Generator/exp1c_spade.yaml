# =============================================================================
# Experiment 1c-spade: 2D conditional DDPM with SPADE conditioning + PatchGAN
# Phase 1 third arm (SPADE lineage). Generator backbone identical to 1b;
# only addition is the conditional PatchGAN discriminator and adversarial
# loss term.
#
# Hypothesis tested: does adversarial pressure unlock SPADE's currently-
# unused per-organ localisation capacity? At 80k pure-DDPM steps, 1b's
# SPADE γ maps encode body shape, not organ-specific patterns
# (TIER1_TUNING_AND_EXPLAINABILITY.md §10, finding 3). Adversarial loss
# provides a different training signal — it may push γ heads to
# specialise per-organ, or it may not. Either outcome is informative.
# =============================================================================

experiment:
  name: "exp1c_spade"
  seed: 42
  output_dir: "/mnt/parscratch/users/ijp25lg/synth_mri/runs/exp1c_spade"
  resume: true

data:
  preprocessed_root: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/processed_generator/D2"
  split_file: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/splits/d2_generator_split.json"
  sequence: "T2FS"
  image_size: 512
  num_label_channels: 6
  ovary_oversample_weight: 3.0
  num_workers: 4

# Generator backbone — IDENTICAL to 1b's SPADE U-Net for ablation parity.
model:
  type: "spade"
  in_channels: 1                # pure SPADE — image only at input
  out_channels: 1
  num_channels: [64, 128, 256, 256]
  attention_levels: [false, false, false, true]
  num_res_blocks: 2
  spade_hidden: 64

# Same discriminator block as 1c_concat — fair comparison across the two arms.
discriminator:
  type: "patchgan"
  base_channels: 64
  use_spectral_norm: true
  lr: 2.5e-5
  weight_decay: 0.0
  lambda_warmup_end: 10000
  lambda_ramp_end: 30000
  lambda_peak: 0.01

diffusion:
  num_train_timesteps: 1000
  beta_schedule: "linear_beta"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "epsilon"

training:
  batch_size: 4
  total_steps: 100000
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  amp: true
  log_every: 50
  sample_every: 5000
  ckpt_every: 5000
  cfg_dropout_prob: 0.1
  ema_decay: 0.9999

sampling:
  # Inherited from 1b's per-variant optimum (SPADE: g=2.0). DDIM steps = 100,
  # same as the rest of Phase 1.
  num_inference_steps: 100
  num_samples_per_grid: 4
  guidance_scale: 2.0
