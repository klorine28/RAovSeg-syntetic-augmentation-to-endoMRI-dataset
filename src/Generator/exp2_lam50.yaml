# =============================================================================
# Exp 2 aggressive tuning: same cross-domain setup as exp2 but with λ_peak
# bumped 50× (0.01 → 0.5). This is a very aggressive adversarial weight —
# standard practice is λ_adv in [0.01, 0.1]. Risks: D collapse, G mode
# collapse, training instability. Watch sample grids at 15k and 30k for
# early signs (blank output, single-image output, or clear T2FS style).
#
# Motivation: exp2 (λ=0.01) plateaued at gray blob; exp2_lam05 (λ=0.05)
# showed marginal improvement late in training. Testing whether an
# even stronger adversarial signal can push G past the DDPM MSE loss's
# pull toward D1 T2 anatomy reconstruction.
# =============================================================================

experiment:
  name: "exp2_lam50"
  seed: 42
  output_dir: "/mnt/parscratch/users/ijp25lg/synth_mri/runs/exp2_lam50"
  resume: true

data:
  generator:
    preprocessed_root: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/processed_generator/D1"
    split_file: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/splits/d1_generator_split.json"
    sequence: "T2"
    image_size: 512
    num_label_channels: 6
    ovary_oversample_weight: 3.0
    num_workers: 4
  discriminator:
    preprocessed_root: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/processed_generator/D2"
    split_file: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/splits/d2_generator_split.json"
    sequence: "T2FS"
    image_size: 512
    num_label_channels: 6
    ovary_oversample_weight: 3.0
    num_workers: 2

model:
  type: "spade"
  in_channels: 1
  out_channels: 1
  num_channels: [64, 128, 256, 256]
  attention_levels: [false, false, false, true]
  num_res_blocks: 2
  spade_hidden: 64

discriminator:
  type: "patchgan"
  base_channels: 64
  use_spectral_norm: true
  lr: 2.5e-5
  weight_decay: 0.0
  lambda_warmup_end: 10000
  lambda_ramp_end: 30000
  lambda_peak: 0.5   # ← 50× exp2's 0.01, 10× lam05's 0.05
  unconditional: true

diffusion:
  num_train_timesteps: 1000
  beta_schedule: "linear_beta"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "epsilon"

training:
  batch_size: 4
  total_steps: 100000
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  amp: true
  log_every: 50
  sample_every: 5000
  ckpt_every: 5000
  cfg_dropout_prob: 0.1
  ema_decay: 0.9999

sampling:
  num_inference_steps: 100
  num_samples_per_grid: 4
  guidance_scale: 2.0
