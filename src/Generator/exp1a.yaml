# =============================================================================
# Experiment 1a: 2D conditional DDPM with concat conditioning
# Phase 1 baseline. No SPADE, no PatchGAN. Pure diffusion.
# =============================================================================

experiment:
  name: "exp1a_ddpm_concat"
  seed: 42
  output_dir: "/mnt/parscratch/users/ijp25lg/synth_mri/runs/exp1a"
  resume: true                  # if a checkpoint is in output_dir, resume from it

data:
  # Output of src/Generator/preprocess_for_generator.py
  preprocessed_root: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/processed_generator/D2"
  # Output of src/Generator/build_generator_split.py
  split_file: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/splits/d2_generator_split.json"
  sequence: "T2FS"              # matches actual filenames (D2-XXX_T2FS.nii.gz)
  image_size: 512
  num_label_channels: 6         # outside_body, uterus, L-ov, R-ov, em, body_other
  ovary_oversample_weight: 3.0
  num_workers: 4

model:
  type: "concat"                # Exp 1a: channel-concat conditioning at input
  in_channels: 7                # 1 image + 6 labels (CONCAT conditioning)
  out_channels: 1               # predicted noise on image
  num_channels: [64, 128, 256, 256]
  # Attention only at the deepest level (64x64). Level-2 attention at 128x128
  # produces a B×H×128^2×128^2 score tensor that OOMs the A100 80GB even at
  # batch 4 (32 GiB for the score tensor, on top of ~53 GiB of activations
  # already cached from earlier down-blocks). Level-3 alone is 2 GiB.
  # This is also standard pixel-space diffusion practice (Imagen, SD-pixel).
  attention_levels: [false, false, false, true]
  num_res_blocks: 2
  num_head_channels: [0, 0, 0, 32]
  norm_num_groups: 32

diffusion:
  num_train_timesteps: 1000
  beta_schedule: "linear_beta"   # MONAI Generative registry key — not "linear"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "epsilon"

training:
  batch_size: 4                 # halved from 8 — self-attention at 128x128 OOMs the A100 80GB at batch 8
  total_steps: 80000
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  amp: true                     # bf16 autocast
  log_every: 50
  sample_every: 5000
  ckpt_every: 5000
  # Classifier-Free Guidance: probability that a training sample's label is
  # replaced with all-zeros (null condition). The model learns both
  # p(x|label) and p(x|∅), enabling inference-time guidance.
  # Ho & Salimans 2022 used 0.1-0.2; we go with 0.1.
  cfg_dropout_prob: 0.1
  # Exponential Moving Average of model weights (Ho 2020). Used for inference
  # only — gives noticeably cleaner samples by smoothing optimisation noise.
  # 0.9999 effectively averages the last ~10k steps. Set to 0 to disable.
  ema_decay: 0.9999

sampling:
  # June 2026 update — per-variant guidance optima. The June Tier 1 sweep found
  # g=2.0 best for 1b (SPADE), but the explainability run at g=2.0 confirmed
  # 1a was *under-conditioned* at that setting: synthetic images were dark and
  # featureless, and per-channel counterfactual responsiveness was muted.
  # Re-running 1a at g=3.0 restored visible organs and strong per-channel
  # counterfactual diffs.
  #
  # Decision: keep DDIM steps shared at 100 (sampler-side parity) but allow
  # the guidance scale to differ per variant. 1a → g=3.0; 1b → g=2.0.
  # See TIER1_TUNING_AND_EXPLAINABILITY.md §10 for the full rationale and
  # the empirical evidence (1a at g=2.0 vs g=3.0 explainability figures).
  num_inference_steps: 100      # DDIM at inference; full T=1000 used in training
  num_samples_per_grid: 4
  # CFG guidance scale: 1.0 = conditional only (no guidance), 0.0 = unconditional,
  # >1.0 = amplified conditioning. SD uses 7.5 by default; for small medical
  # datasets 3-5 is typically safer. Set to 1.0 to disable CFG even if the
  # model was trained with dropout.
  guidance_scale: 3.0
