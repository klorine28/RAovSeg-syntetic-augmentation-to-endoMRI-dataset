# =============================================================================
# Experiment 2: cross-domain conditional DDPM with SPADE + PatchGAN.
#
# Generator sees D1_MHS T2 (non-fat-suppressed, ~32 subjects, larger anatomy
# variety); discriminator sees D2_TCPW T2FS (fat-suppressed, ~41 subjects).
# The adversarial pressure pushes the generator to translate T2 → T2FS style
# while keeping the SPADE anatomy conditioning intact. At inference we
# condition on D1 masks to produce D2-T2FS-styled synth of D1 anatomy —
# the augmentation samples for RAovSeg.
#
# Discriminator is UNCONDITIONAL in Phase 2 (label channel is zeroed before
# reaching D). Rationale: with dual-cohort inputs, a conditional D would
# trivially learn to distinguish real vs fake by label-distribution
# differences between D1 and D2, short-circuiting the style-transfer signal
# we actually want.
#
# Everything else — U-Net backbone, EMA, CFG dropout, DDIM sampling,
# lambda_adv schedule — inherits from exp1c_spade.yaml verbatim for
# ablation parity against Phase 1 v3 SPADE.
# =============================================================================

experiment:
  name: "exp2_d1_gen_d2_disc"
  seed: 42
  output_dir: "/mnt/parscratch/users/ijp25lg/synth_mri/runs/exp2_d1_gen_d2_disc"
  resume: true

data:
  # Phase 2 dual-cohort schema: separate `generator` and `discriminator`
  # sources. If both are present, train.py runs in dual-loader mode; otherwise
  # falls back to the Phase 1 single-loader path.
  generator:
    preprocessed_root: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/processed_generator/D1"
    split_file: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/splits/d1_generator_split.json"
    sequence: "T2"
    image_size: 512
    num_label_channels: 6
    ovary_oversample_weight: 3.0
    num_workers: 4
  discriminator:
    preprocessed_root: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/processed_generator/D2"
    split_file: "/mnt/parscratch/users/ijp25lg/synth_mri/EndometriosisDataset/data/splits/d2_generator_split.json"
    sequence: "T2FS"
    image_size: 512
    num_label_channels: 6
    ovary_oversample_weight: 3.0
    num_workers: 2   # smaller — D uses D2 batches only for the real path

# Generator backbone — IDENTICAL to 1b/1c_spade for ablation parity.
model:
  type: "spade"
  in_channels: 1
  out_channels: 1
  num_channels: [64, 128, 256, 256]
  attention_levels: [false, false, false, true]
  num_res_blocks: 2
  spade_hidden: 64

discriminator:
  type: "patchgan"
  base_channels: 64
  use_spectral_norm: true
  lr: 2.5e-5
  weight_decay: 0.0
  lambda_warmup_end: 10000
  lambda_ramp_end: 30000
  lambda_peak: 0.01
  # Phase 2 flag: zero out the label channel before feeding to D so D judges
  # style only (no label-distribution shortcut across D1↔D2). Phase 1
  # configs (1c_concat/spade) omit this flag → conditional D.
  unconditional: true

diffusion:
  num_train_timesteps: 1000
  beta_schedule: "linear_beta"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "epsilon"

training:
  batch_size: 4
  total_steps: 100000
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  amp: true
  log_every: 50
  sample_every: 5000
  ckpt_every: 5000
  cfg_dropout_prob: 0.1
  ema_decay: 0.9999

sampling:
  num_inference_steps: 100
  num_samples_per_grid: 4
  guidance_scale: 2.0
